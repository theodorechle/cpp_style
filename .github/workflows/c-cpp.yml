name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install tests lib
      run: |
        git clone https://github.com/theodorechle/cpp_tests
        make -j $(nproc)
        sudo make install

    - name: Compile tests
      run: make -j $(nproc) tests
    - name: Execute tests
      run: bin/tests
