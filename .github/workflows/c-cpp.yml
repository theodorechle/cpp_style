name: C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: self-hosted

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install tests lib
      run: |
        git clone https://github.com/theodorechle/cpp_tests
        cd cpp_tests
        make -j $(nproc)
        make install INSTALL_PATH=/tmp/libs
        cd ..

    - name: Install commons lib
      run: |
        git clone https://github.com/theodorechle/cpp_commons
        cd cpp_commons
        make -j $(nproc)
        make install INSTALL_PATH=/tmp/libs
        cd ..

    - name: Compile tests
      run: make -j $(nproc) tests SHARED_LIBS_BASE_PATH=/tmp/libs
    - name: Execute tests
      run: bin/tests
